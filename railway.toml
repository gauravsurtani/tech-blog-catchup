# Shared Railway policy for the frontend and backend services.
# Each service selects its own root directory and Dockerfile in Railway:
# frontend -> frontend/Dockerfile; backend -> backend/Dockerfile.
# Do not set a backend Dockerfile or API health path here: this repository-root
# config can also be discovered by the frontend, overriding its service settings.

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
